version: "3.9"
services:
  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:14.5
    volumes:
      - ./db-data:/var/lib/postgresql/data

    env_file:
      - .env.production

    ports:
      - 5434:5432

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  zingping-api:
    volumes:
      - .:app

    build: .

    ports:
      - "8080:8080"

    depends_on:
      - redis
      - db

    env_file:
      - .env.production
