name: CI/CD - Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/server/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the services defined in docker-compose.yml
      - name: Build Docker images using Docker Compose
        run: |
          cd apps/server
          docker compose build --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }}

      # Step 5: Push the built images to Docker Hub
      - name: Push Docker images using Docker Compose
        run: cd apps/server && DATABASE_URL=${{ secrets.DATABASE_URL }} docker compose push
